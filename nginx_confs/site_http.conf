# The pool's website on HTTP only (no certificate). web.sh writes it to
# /etc/nginx/sites-available/__DOMAIN__.conf.
include /etc/nginx/blockuseragents.rules;

# NGINX Simple DDoS Defense
# limit the number of connections per single IP
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# limit the number of requests for a given session
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:40m rate=5r/s;

# zone which we want to limit by upper values, we want limit whole server
limit_conn conn_limit_per_ip 80;
limit_req zone=req_limit_per_ip burst=80 nodelay;

server {
	listen 80;
	listen [::]:80;
	server_name __SERVER_NAMES__;

	include /etc/nginx/snippets/yiimp-site.conf;
}
