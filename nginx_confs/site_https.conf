# The pool's website on HTTPS (Let's Encrypt's certificate): HTTP answers Let's Encrypt and sends
# everyone else to HTTPS. web.sh writes it to /etc/nginx/sites-available/__DOMAIN__.conf.
include /etc/nginx/blockuseragents.rules;

# NGINX Simple DDoS Defense
# limit the number of connections per single IP
limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

# limit the number of requests for a given session
limit_req_zone $binary_remote_addr zone=req_limit_per_ip:40m rate=5r/s;

# zone which we want to limit by upper values, we want limit whole server
limit_conn conn_limit_per_ip 80;
limit_req zone=req_limit_per_ip burst=80 nodelay;

server {
	listen 80;
	listen [::]:80;
	server_name __SERVER_NAMES__;

	# The certificate's renewals
	location /.well-known/acme-challenge/ {
		root "__WEB_ROOT__";
	}
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name __SERVER_NAMES__;

	ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
	# TLS 1.2 and 1.3 with forward secrecy only (Mozilla's "intermediate" settings)
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# Security headers
	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options nosniff always;
	add_header X-Robots-Tag none;
	add_header Content-Security-Policy "frame-ancestors 'self'";

	include /etc/nginx/snippets/yiimp-site.conf;
}
