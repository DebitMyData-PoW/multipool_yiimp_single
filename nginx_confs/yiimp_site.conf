# The YiiMP website, in the site's server blocks (web.sh writes it to
# /etc/nginx/snippets/yiimp-site.conf, with the __PLACEHOLDERS__ filled in).

if ($blockedagent) {
	return 403;
}
if ($request_method !~ ^(GET|HEAD|POST)$) {
	return 444;
}

root "__WEB_ROOT__";
index index.php;
charset utf-8;

location / {
	try_files $uri $uri/ /index.php?$args;
}
location @rewrite {
	rewrite ^/(.*)$ /index.php?r=$1;
}

# The admin portal: nginx asks for its password (/etc/nginx/.pma_pass_panel). The website lets
# in whoever gets past it (its IP checks always say yes), so never remove this block.
location /site/AdminPortal {
	try_files $uri $uri/ /index.php?$args;
	auth_basic "Restricted Content";
	auth_basic_user_file /etc/nginx/.pma_pass_panel;
	access_log __LOG_DIR__/__DOMAIN__.access.log;
}

# Not for visitors: the framework's runtime folder (its error log has paths and requests), and
# logs, keys, dumps and settings anywhere.
location ^~ /yaamp/runtime/ {
	deny all;
}
location ~* \.(log|pem|key|sql|gz|conf|ini|bak|old)$ {
	deny all;
}

location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt { access_log off; log_not_found off; }

# Only the admin portal is logged (who opened it: a 302 answer means they got in).
access_log off;
error_log __LOG_DIR__/__DOMAIN__.app-error.log error;

# if the request body size is more than the buffer size, then the entire (or partial)
# request body is written into a temporary file
client_body_buffer_size 128k;

# headerbuffer size for the request header from client
client_header_buffer_size 3m;

# maximum number and size of buffers for large headers to read from client request
large_client_header_buffers 4 256k;

# how long to wait for the client to send a request header
client_header_timeout 3m;

# copies data between one FD and other from within the kernel
sendfile on;

# send headers in one piece, it is better than sending them one by one
tcp_nopush on;

# good for small data bursts in real time
tcp_nodelay on;

# allow the server to close connection on non responding client, this will free up memory
reset_timedout_connection on;

# request timed out -- default 60
client_body_timeout 10;

# if client stop responding, free up memory -- default 60
send_timeout 2;

# server will close connection after this time -- default 75
keepalive_timeout 30;

location ~ ^/index\.php$ {
	fastcgi_split_path_info ^(.+\.php)(/.+)$;
	fastcgi_pass unix:__PHP_SOCKET__;
	fastcgi_index index.php;
	include fastcgi_params;
	fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
	fastcgi_intercept_errors off;
	fastcgi_buffer_size 16k;
	fastcgi_buffers 4 16k;
	fastcgi_connect_timeout 300;
	fastcgi_send_timeout 300;
	fastcgi_read_timeout 300;
	try_files $uri $uri/ =404;
}

location ~ \.php$ {
	return 404;
}

location ~ \.sh {
	return 404;
}

location ~ /\.ht {
	deny all;
}

location ~ /.well-known {
	allow all;
}
